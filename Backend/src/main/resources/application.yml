server:
  # Fly.io inyecta PORT; en local por defecto 8080.
  port: ${PORT:8080}

spring:
  application:
    name: continuous-auth-backend

  datasource:
    # Por defecto: H2 en memoria (desarrollo local).
    # En despliegue (Supabase/Fly): definir DATABASE_URL (DatabaseConfig lo
    # convierte a JDBC) o bien DB_URL/DB_USERNAME/DB_PASSWORD directamente.
    url: ${DB_URL:jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

# --- Configuración del dominio ------------------------------------------------
app:
  jwt:
    # En producción debe venir de variable de entorno (APP_JWT_SECRET).
    secret: ${APP_JWT_SECRET:JDV3GLeSJvcD9sDKSgD64fL7/2C178GhXJEebxUdVf4=}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}  # 24h

  # Cliente hacia el servicio Python (modelo IsolationForest).
  ml:
    base-url: ${ML_BASE_URL:http://127.0.0.1:8000}
    predict-path: ${ML_PREDICT_PATH:/api/predict/}
    retrain-path: ${ML_RETRAIN_PATH:/api/retrain/}
    connect-timeout-ms: ${ML_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${ML_READ_TIMEOUT_MS:10000}

  # CORS: orígenes permitidos (separados por coma). "*" = cualquiera.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    com.autentication: ${LOG_LEVEL:DEBUG}
