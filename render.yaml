# Render Blueprint — despliegue completo (PLAN GRATUITO / FREE).
#
# Estructura del repo:
#   Front/                         -> sitio estático (React/Vite)
#   Backend/                       -> Web Service Java (Docker, Spring Boot)
#   Modelo_predictivo_contrasenas/ -> Web Service Python (Docker, Django)
#
# NOTA sobre persistencia (plan free):
#   - El plan gratuito NO permite Discos persistentes.
#   - Los modelos del DATASET (sXXX) SI sobreviven: van empaquetados en la imagen.
#   - Los modelos de USUARIO (user-*) y de cursor viven en el contenedor y se
#     pierden en cada redeploy/reinicio. Para persistirlos de verdad se necesita
#     plan Starter + Disco, o almacenamiento de objetos (fase futura).
#
# Uso: New > Blueprint > conectar repo. Render crea 3 servicios + 1 base de datos.
# Los secretos `sync: false` se rellenan en el panel tras el primer deploy.

services:
  # 1) Microservicio de ML (Django + scikit-learn) ---------------------------------
  - type: web
    name: continuous-auth-ml
    runtime: docker
    plan: free
    rootDir: Modelo_predictivo_contrasenas
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/metrics/summary/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ML_DECISION_THRESHOLD
        value: "0.021328"
      # Sin disco: sin ML_USER_MODELS_DIR => modelos de usuario en el contenedor.
      - key: DATABASE_URL
        fromDatabase:
          name: continuous-auth-db
          property: connectionString

  # 2) Backend (Spring Boot, Java 17) ----------------------------------------------
  - type: web
    name: continuous-auth-backend
    runtime: docker
    plan: free
    rootDir: Backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      # URL COMPLETA del ML con http(s):// . Se rellena en el panel.
      - key: ML_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: continuous-auth-db
          property: connectionString

  # 3) Frontend (React + Vite, build estatico) -------------------------------------
  - type: web
    name: continuous-auth-front
    runtime: static
    rootDir: Front
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # URL COMPLETA del backend + /api . Se rellena en el panel.
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: continuous-auth-db
    plan: free
    databaseName: continuous_auth
    user: continuous_auth

