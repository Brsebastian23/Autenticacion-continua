# Render Blueprint — despliegue completo del sistema de autenticación continua.
#
# Estructura del repo:
#   Front/                         -> sitio estático (React/Vite)
#   Backend/                       -> Web Service Java (Docker, Spring Boot)
#   Modelo_predictivo_contrasenas/ -> Web Service Python (Docker, Django) + Disco
#
# Uso:
#   1. En Render: "New" -> "Blueprint" -> conecta este repositorio.
#   2. Render detecta este archivo y crea los 3 servicios + la base de datos.
#   3. Define los secretos marcados como `sync: false` en el panel.
#
# Orden de dependencias: el backend necesita la URL del ML (ML_BASE_URL) y el
# front necesita la URL del backend (VITE_API_URL). Se resuelven con `fromService`.

services:
  # 1) Microservicio de ML (Django + scikit-learn) ---------------------------------
  - type: web
    name: continuous-auth-ml
    runtime: docker
    plan: starter
    rootDir: Modelo_predictivo_contrasenas
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/metrics/summary/
    numInstances: 1
    disks:
      - name: user-models
        mountPath: /data
        sizeGB: 1
    envVars:
      - key: ML_USER_MODELS_DIR
        value: /data/user_models
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ML_DECISION_THRESHOLD
        value: "0.021328"
      - key: DATABASE_URL
        fromDatabase:
          name: continuous-auth-db
          property: connectionString

  # 2) Backend (Spring Boot, Java 17) ----------------------------------------------
  - type: web
    name: continuous-auth-backend
    runtime: docker
    plan: starter
    rootDir: Backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      # URL COMPLETA del ML con http:// (p. ej. https://continuous-auth-ml.onrender.com).
      # `fromService` solo da host:puerto (sin esquema) y el cliente Java necesita
      # la URL completa, por eso se rellena en el panel tras el primer deploy.
      - key: ML_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: continuous-auth-db
          property: connectionString

  # 3) Frontend (React + Vite, build estático) -------------------------------------
  - type: web
    name: continuous-auth-front
    runtime: static
    rootDir: Front
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # URL COMPLETA del front para el backend, con /api (p. ej.
      # https://continuous-auth-backend.onrender.com/api). Se rellena en el panel.
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: continuous-auth-db
    plan: free
    databaseName: continuous_auth
    user: continuous_auth
